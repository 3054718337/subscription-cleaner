<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="续费管家：粘贴账单自动识别连续包月订阅，红黄绿风险标注，一键退订指引，AI 助手答疑" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>续费管家 · 自动续费清理</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div>
        <h1>续费管家</h1>
        <p class="tagline">自动识别连续包月 · 一键退订 · 红黄绿风险标注</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">月均支出</span>
        <span class="stat-value" id="statMonthly">¥0</span>
      </div>
      <div class="stat">
        <span class="stat-label">订阅数</span>
        <span class="stat-value" id="statCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">高风险</span>
        <span class="stat-value" id="statRed">0</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card import-panel">
      <div class="panel-head">
        <h2>导入账单</h2>
        <span class="panel-sub">粘贴微信/支付宝账单或银行扣款短信，自动扫描订阅项</span>
      </div>
      <textarea id="billInput" rows="6" spellcheck="false"
        placeholder="例如：&#10;微信支付-爱奇艺视频会员 15.00&#10;支付宝-淘宝88VIP会员 88.00&#10;您尾号1234的卡于10月25日消费15.00元，商户：爱奇艺&#10;Apple：Apple Music 会员 11.00"></textarea>
      <div class="import-actions">
        <button id="scanBtn" class="btn primary">自动扫描</button>
        <button id="demoBtn" class="btn ghost">填入示例账单</button>
        <button id="clearInputBtn" class="btn ghost">清空</button>
      </div>
      <div id="importWarnings" class="warnings" hidden></div>
    </section>

    <section class="card list-panel">
      <div class="list-head">
        <h2>订阅列表</h2>
        <div class="risk-filter" id="riskFilter">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="red">高风险</button>
          <button class="chip" data-filter="yellow">中风险</button>
          <button class="chip" data-filter="green">低风险</button>
        </div>
        <button id="addBtn" class="btn ghost">手动添加</button>
      </div>
      <div id="subsList" class="subs-list"></div>
      <div id="emptyState" class="empty" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8.5 11h5M11 8.5v5"/></svg>
        <p>还没有订阅项</p>
        <p class="empty-sub">在上方粘贴账单「自动扫描」，或点击「手动添加」</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>数据仅保存在你的浏览器本地，不会上传。退订需在对应平台内完成，本工具只提供指引。</p>
  </footer>

  <!-- 退订指引弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close aria-label="关闭">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- AI 助手 -->
  <button id="chatFab" class="chat-fab" aria-label="打开 AI 助手">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2 1-4a8 8 0 1 1 17-6z"/></svg>
  </button>
  <aside id="chatPanel" class="chat-panel" hidden>
    <div class="chat-head">
      <div>
        <strong>续费管家 AI 助手</strong>
        <span class="chat-status" id="chatStatus">未配置 API Key</span>
      </div>
      <div class="chat-head-actions">
        <button id="keyBtn" class="icon-btn" title="设置 API Key" aria-label="设置 API Key">⚙</button>
        <button id="chatClose" class="icon-btn" aria-label="关闭">&times;</button>
      </div>
    </div>
    <div id="keyBar" class="key-bar" hidden>
      <p class="key-hint">填入你自己的 Anthropic API Key（<code>sk-ant-...</code>）。只保存在本浏览器，发送时直连 api.anthropic.com，不经过任何第三方服务器，费用计入你自己的账号。</p>
      <input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
      <div class="key-actions">
        <button id="keySave" class="btn primary small">保存</button>
        <button id="keyClear" class="btn ghost small">清除</button>
      </div>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="问我：这笔订阅该不该退？" autocomplete="off" />
      <button id="chatSend" class="btn primary">发送</button>
    </div>
  </aside>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
